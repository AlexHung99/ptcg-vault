<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCTG VAULT — 寶可夢卡牌資料庫</title>
  <meta name="description" content="PCTG VAULT：寶可夢 Pocket 卡牌圖鑑，3406 張卡，依系列、屬性、卡類、稀有度搜尋瀏覽。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="hd">
    <div class="hd__wrap">
      <a class="hd__brand" href="#" data-view="home">
        <span class="hd__logo">PCTG</span><span class="hd__logo2">VAULT</span>
      </a>
      <nav class="hd__nav">
        <button class="hd__tab is-active" data-view="home">首頁</button>
        <button class="hd__tab" data-view="lib">卡庫</button>
        <button class="hd__tab" data-view="deck">牌組 &amp; 勝率</button>
      </nav>
      <button class="hd__auth" data-view="auth">登入 / 註冊</button>
    </div>
  </header>

  <!-- 首頁 -->
  <main class="view view--home is-active" id="view-home"></main>

  <!-- 卡庫 -->
  <main class="view" id="view-lib">
    <section class="search">
      <div class="search__box">
        <span class="search__ico">⌕</span>
        <input id="q" type="search" placeholder="搜尋卡名（中／英／日）或編號…" autocomplete="off">
      </div>
    </section>
    <section class="sets" id="sets"></section>
    <section class="fbar" id="fbar"></section>
    <div class="fbar__meta"><span id="resultN"></span><button id="clearF" class="fclear" type="button">清除篩選</button></div>
    <section class="grid" id="grid" aria-live="polite"></section>
    <div class="more" id="more" hidden><button id="moreBtn" type="button">載入更多</button></div>
    <p class="empty" id="empty" hidden>找不到符合條件的卡片。</p>
  </main>

  <!-- 牌組 & 勝率 -->
  <main class="view" id="view-deck">
    <div class="deck__lock">
      <div class="deck__ico">▤</div>
      <h2>牌組 &amp; 勝率</h2>
      <p>登入後可建立 20 張對戰牌組、記錄每場勝率。此功能需要帳號系統，將於後台串接後開放。</p>
    </div>
  </main>

  <!-- 登入 / 註冊 -->
  <main class="view view--auth" id="view-auth">
    <div class="auth">
      <div class="auth__brand"><span class="hd__logo">PCTG</span><span class="hd__logo2">VAULT</span></div>
      <div class="auth__tabs">
        <button class="auth__tab is-active" data-auth="login">登入</button>
        <button class="auth__tab" data-auth="register">註冊</button>
      </div>
      <div class="auth__notice" id="authNotice" hidden></div>

      <!-- 登入 -->
      <form class="auth__form is-active" id="loginForm" novalidate>
        <div class="afield">
          <label for="lEmail">電子郵件</label>
          <input id="lEmail" type="email" autocomplete="email" placeholder="you@example.com">
          <small class="aerr"></small>
        </div>
        <div class="afield">
          <label for="lPass">密碼</label>
          <div class="apass"><input id="lPass" type="password" autocomplete="current-password" placeholder="輸入密碼"><button type="button" class="apass__t" data-toggle="lPass">顯示</button></div>
          <small class="aerr"></small>
        </div>
        <label class="achk"><input type="checkbox" id="lRemember"><span>記住我</span><a class="alink" href="#">忘記密碼？</a></label>
        <button class="abtn" type="submit">登入</button>
        <div class="auth__foot">還沒有帳號？<a data-auth="register">立即註冊</a></div>
      </form>

      <!-- 註冊 -->
      <form class="auth__form" id="registerForm" novalidate>
        <div class="afield">
          <label for="rName">暱稱</label>
          <input id="rName" type="text" autocomplete="nickname" placeholder="你的暱稱">
          <small class="aerr"></small>
        </div>
        <div class="afield">
          <label for="rEmail">電子郵件</label>
          <input id="rEmail" type="email" autocomplete="email" placeholder="you@example.com">
          <small class="aerr"></small>
        </div>
        <div class="afield">
          <label for="rPass">密碼</label>
          <div class="apass"><input id="rPass" type="password" autocomplete="new-password" placeholder="至少 6 碼"><button type="button" class="apass__t" data-toggle="rPass">顯示</button></div>
          <small class="aerr"></small>
        </div>
        <div class="afield">
          <label for="rPass2">確認密碼</label>
          <input id="rPass2" type="password" autocomplete="new-password" placeholder="再次輸入密碼">
          <small class="aerr"></small>
        </div>
        <label class="achk"><input type="checkbox" id="rAgree"><span>我已閱讀並同意<a class="alink" href="#">服務條款</a>與<a class="alink" href="#">隱私權政策</a></span></label>
        <button class="abtn" type="submit">建立帳號</button>
        <div class="auth__foot">已有帳號？<a data-auth="login">前往登入</a></div>
      </form>
    </div>
  </main>

  <!-- 詳情抽屜 -->
  <div class="dw" id="drawer" hidden>
    <div class="dw__mask" id="dwMask"></div>
    <aside class="dw__panel" role="dialog" aria-modal="true" aria-label="卡片詳情">
      <button class="dw__close" id="dwClose" aria-label="關閉">✕</button>
      <div class="dw__body" id="dwBody"></div>
    </aside>
  </div>

  <footer class="ft">PCTG VAULT · 寶可夢 Pocket 卡牌圖鑑 · 資料 <span id="ftTotal">—</span> 張</footer>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
